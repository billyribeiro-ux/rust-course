<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A form is a state machine</title><style>body{font:18px/1.6 system-ui;max-width:600px;margin:3rem auto;padding:1rem}label,input,button{display:block;margin:.8rem 0;font:inherit}input:focus-visible,button:focus-visible{outline:3px solid #176cb5;outline-offset:3px}</style></head><body><main><h1>Local quantity form</h1><form id="quantity-form"><label for="quantity">Whole units (1–100)</label><input id="quantity" name="quantity" type="number" min="1" max="100" required><button>Preview quantity</button></form><p role="status" id="result">No quantity submitted.</p></main><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const n=Number(document.querySelector('input').value);document.querySelector('#result').textContent=Number.isInteger(n)&&n>=1&&n<=100?'Preview: '+n+' units':'Enter a whole number from 1 to 100.';});</script></body></html>
