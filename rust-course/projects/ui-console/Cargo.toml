[package]
name = "operations-console"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.129"
gloo-net = { version = "=0.7.0", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "=0.4.0", features = ["futures"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
web-sys = { version = "=0.3.106", features = ["AbortController", "AbortSignal"] }
uuid = { version = "=1.28.0", features = ["v4", "js"] }
course-ui-model = { path = "../reference/p11-ui-model" }
