[workspace]
members = ["reference/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Optional, deliberately separate from the default full-debug local workflow.
[profile.small]
inherits = "dev"
debug = 1
incremental = false
