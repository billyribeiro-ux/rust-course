<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Rust console · local state checkpoint</title>
<style>body{font:1.1rem/1.6 system-ui,sans-serif;max-width:50rem;margin:3rem auto;padding:0 1.5rem;color:#172b35;background:#f8faf9}input{font:inherit;display:block;padding:.6rem;border:2px solid #46616d;border-radius:.3rem;max-width:100%;box-sizing:border-box}label{display:block}input:focus-visible{outline:3px solid #006d77;outline-offset:3px}code{overflow-wrap:anywhere}</style></head>
<body><p id="boot-status" role="status">Build this learner client with <code>scripts/build-ui.py --project learner-work/p11-console</code>, then serve it with <code>scripts/console-server.py --project learner-work/p11-console</code>. This checkpoint teaches local filter state and does not contact the API.</p>
<noscript>The client needs JavaScript and WebAssembly. The HTML course remains readable without them.</noscript>
<script type="module">
const status = document.querySelector('#boot-status');
try {
  const { default: init } = await import('./pkg/console_learner.js');
  await init();
  status.remove();
} catch (error) {
  status.textContent = 'The learner client could not load. Build the selected project with build-ui.py --project, then serve that same folder with console-server.py --project. ' + error.message;
}
</script></body></html>
